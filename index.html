<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>PDF Marker</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eceef1; --panel: #fff; --line: #d9dde3; --text: #1d2430; --muted: #68717f;
    --accent: #1f5fbf; --accent-soft: #e4edfb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template: auto 1fr / 250px 1fr; color: var(--text); background: var(--bg);
         font: 14px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 12px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  .group { display: flex; align-items: center; gap: 4px; padding-right: 10px; margin-right: 4px;
           border-right: 1px solid var(--line); }
  button { font: inherit; color: inherit; background: none; border: 1px solid transparent; border-radius: 6px;
           padding: 5px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  button:hover:not(:disabled) { background: #f0f2f5; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; }
  kbd { font: 11px/1 ui-monospace, monospace; color: var(--muted); }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .swatch.on { border-color: var(--text); }
  #save { background: var(--accent); color: #fff; font-weight: 600; padding: 5px 14px; }
  #save:hover:not(:disabled) { background: #184d9b; }
  #status { margin-left: auto; color: var(--muted); }
  #status.error { color: #c02020; font-weight: 600; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
  #pick { width: 100%; justify-content: center; border-color: var(--line); margin-bottom: 6px; }
  #root { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 10px; }
  details { margin-bottom: 6px; }
  summary { padding: 4px 2px; font-weight: 600; cursor: pointer; word-break: break-all; }
  .file { display: flex; width: 100%; justify-content: space-between; text-align: left; word-break: break-all; }
  .file.on { background: var(--accent-soft); color: var(--accent); }
  .badge { flex: none; margin-left: 6px; padding: 0 7px; border-radius: 9px; font-size: 12px;
           background: #dff3e6; color: #17693a; }
  main { overflow: auto; padding: 16px; }
  #empty { margin-top: 20vh; text-align: center; color: var(--muted); }
  .page { position: relative; margin: 0 auto 16px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .page img { display: block; width: 100%; height: 100%; }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  svg.draw { cursor: crosshair; }
  svg.text { cursor: text; }
  [data-id] { cursor: move; }
  .note { padding: 3px 4px; font: var(--size)/1.3 Helvetica, Arial, sans-serif; background: #fffacc;
          white-space: pre-wrap; overflow-wrap: anywhere; }
  textarea.note { display: block; width: 100%; resize: none; border: 0; outline: 1px solid var(--accent);
                  overflow: hidden; }
  .handle { fill: #fff; stroke: var(--accent); }
  foreignObject { overflow: visible; }
  .noteWrap { position: relative; }
  .grip { position: absolute; left: 0; right: 0; top: -9px; height: 9px; background: var(--accent);
          border-radius: 3px 3px 0 0; cursor: move; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="group" id="tools"></div>
  <div class="group" id="colors"></div>
  <div class="group">
    <button id="undo" title="撤销 Ctrl+Z">撤销</button>
    <button id="redo" title="重做 Ctrl+Y">重做</button>
    <button id="delete" title="删除选中 Delete">删除</button>
  </div>
  <div class="group">
    <button id="zoomOut" title="缩小">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" title="放大">+</button>
  </div>
  <button id="save" title="Ctrl+S">保存</button>
  <button id="openPdf" title="在新标签页查看已保存的 PDF">查看 PDF</button>
  <span id="status"></span>
</header>
<aside>
  <button id="pick">选择工作区</button>
  <div id="root"></div>
  <div id="files"></div>
</aside>
<main id="main"><div id="empty">先选择工作区，再在左侧打开一份 PDF</div></main>

<script>
const ICONS = {
  select: '<path d="M5 3l14 9-6 1.5L10 20z"/>',
  tick: '<path d="M4 13l5 6L20 5"/>',
  cross: '<path d="M5 5l14 14M19 5L5 19"/>',
  highlight: '<rect x="3" y="8" width="18" height="8" fill="#ffe24d" stroke="none"/><path d="M3 8h18M3 16h18"/>',
  text: '<path d="M4 5h16v11H10l-4 4v-4H4z"/>',
  circle: '<ellipse cx="12" cy="12" rx="9" ry="7"/>',
  line: '<path d="M4 19L20 5"/>',
};
const TOOLS = [
  ['select', '选择', 'V'], ['tick', '打勾', '1'], ['cross', '打叉', '2'], ['highlight', '高亮', '3'],
  ['text', '批注', '4'], ['circle', '画圈', '5'], ['line', '划线', '6'],
];
const COLORS = ['#d92b2b', '#1f9d55', '#2563eb', '#ffd400'];
const toolColor = { tick: '#1f9d55', cross: '#d92b2b', highlight: '#ffd400', text: '#d92b2b',
                    circle: '#d92b2b', line: '#d92b2b' };
const STAMP_SIZE = 14, STAMP_WIDTH = 1.5, MIN_DRAG = 5, NOTE_WIDTH = 190, NOTE_SIZE = 11, NOTE_GAP = 24, LINE_WIDTH = 2, LEADER_WIDTH = .6;
const NOTE_AFTER = new Set(['cross', 'circle', 'line']);  // these open a comment box as soon as they are drawn
const SVG = 'http://www.w3.org/2000/svg';

const $ = id => document.getElementById(id);
let file = null, pages = [], marks = [], selected = null, tool = 'select', zoom = 1;
let dirty = false, undoStack = [], redoStack = [], gesture = null, editing = null;

const clone = value => JSON.parse(JSON.stringify(value));
const markById = id => marks.find(m => m.id === id);
const svgFor = page => document.querySelector(`.page[data-n="${page}"] svg`);
const el = (name, attrs = {}) => {
  const node = document.createElementNS(SVG, name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
};

function status(text, isError = false) {
  $('status').textContent = text;
  $('status').className = isError ? 'error' : '';
}

function refreshButtons() {
  $('undo').disabled = !undoStack.length;
  $('redo').disabled = !redoStack.length;
  $('delete').disabled = !selected;
  $('save').disabled = !file || !dirty;
  $('openPdf').disabled = !file;
  const color = selected ? markById(selected)?.color : toolColor[tool];
  document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('on', b.dataset.color === color));
}

function setDirty() {
  dirty = true;
  status('有未保存的修改');
}

/* Every change goes through here so undo always has the previous state. */
function change(update, before = clone(marks)) {
  update();
  undoStack.push(before);
  redoStack = [];
  setDirty();
  redraw();
}

function restore(from, to) {
  if (!from.length) return;
  finishEditing();
  to.push(clone(marks));
  marks = from.pop();
  if (!markById(selected)) selected = null;
  setDirty();
  redraw();
}

/* ---------- drawing ---------- */
function bounds(m) {
  if (m.type !== 'line') return { x: m.x, y: m.y, w: m.w, h: m.h };
  return { x: Math.min(m.x1, m.x2), y: Math.min(m.y1, m.y2),
           w: Math.abs(m.x2 - m.x1), h: Math.abs(m.y2 - m.y1) };
}

function shapePath(m) {
  const at = (u, v) => `${m.x + u * m.w} ${m.y + v * m.h}`;
  return m.type === 'tick' ? `M${at(0, .55)}L${at(.35, 1)}L${at(1, 0)}`
                           : `M${at(0, 0)}L${at(1, 1)}M${at(1, 0)}L${at(0, 1)}`;
}

function drawMark(svg, m) {
  const group = el('g', { 'data-id': m.id });
  const stroke = { stroke: m.color, 'stroke-width': m.width, fill: 'none', 'stroke-linecap': 'round',
                   'stroke-linejoin': 'round' };
  if (m.type === 'tick' || m.type === 'cross') {
    const d = shapePath(m);
    group.append(el('path', { d, stroke: 'transparent', 'stroke-width': 10, fill: 'none' }), el('path', { d, ...stroke }));
  } else if (m.type === 'line') {
    const ends = { x1: m.x1, y1: m.y1, x2: m.x2, y2: m.y2 };
    group.append(el('line', { ...ends, stroke: 'transparent', 'stroke-width': 10 }), el('line', { ...ends, ...stroke }));
  } else if (m.type === 'circle') {
    const shape = { cx: m.x + m.w / 2, cy: m.y + m.h / 2, rx: m.w / 2, ry: m.h / 2 };
    group.append(el('ellipse', { ...shape, stroke: 'transparent', 'stroke-width': 10, fill: 'none' }), el('ellipse', { ...shape, ...stroke }));
  } else if (m.type === 'highlight') {
    group.append(el('rect', { x: m.x, y: m.y, width: m.w, height: m.h, fill: m.color, opacity: .4 }));
  } else if (m.type === 'text') {
    group.append(drawNote(m));
  }
  svg.append(group);
  if (m.type === 'text') {
    const box = group.querySelector('.note');
    m.h = Math.ceil(box.offsetHeight);
    group.firstChild.setAttribute('height', m.h);
  }
}

function drawNote(m) {
  const holder = el('foreignObject', { x: m.x, y: m.y, width: m.w, height: Math.max(m.h, 400) });
  const box = document.createElement(editing === m.id ? 'textarea' : 'div');
  box.className = 'note';
  box.style.setProperty('--size', m.size + 'px');
  box.style.color = m.color;
  if (editing === m.id) {
    box.value = m.text;
    box.placeholder = '回车确认，Shift+回车换行';
    const fit = () => { box.style.height = 'auto'; box.style.height = box.scrollHeight + 'px'; };
    box.addEventListener('input', fit);
    box.addEventListener('blur', finishEditing);
    box.addEventListener('keydown', event => {
      event.stopPropagation();
      const confirm = event.key === 'Enter' && !event.shiftKey && !event.isComposing;
      if (confirm || event.key === 'Escape') { event.preventDefault(); box.blur(); }
    });
    box.addEventListener('pointerdown', event => event.stopPropagation());
    requestAnimationFrame(() => { fit(); box.focus({ preventScroll: true }); });
    const wrap = document.createElement('div');
    wrap.className = 'noteWrap';
    wrap.append(gripFor(m, holder), box);
    holder.append(wrap);
    return holder;
  }
  box.textContent = m.text;
  holder.append(box);
  return holder;
}

/* Moves the note being typed in. Redrawing would drop the textarea, so only its position changes. */
function gripFor(m, holder) {
  const grip = document.createElement('div');
  grip.className = 'grip';
  grip.title = '拖动文本框';
  grip.addEventListener('mousedown', event => event.preventDefault());  // keep typing focus
  grip.addEventListener('pointerdown', event => {
    event.stopPropagation();
    grip.setPointerCapture(event.pointerId);
    const svg = holder.ownerSVGElement, start = pointIn(svg, event), x = m.x, y = m.y;
    grip.onpointermove = move => {
      const p = pointIn(svg, move);
      m.x = x + p.x - start.x;
      m.y = y + p.y - start.y;
      holder.setAttribute('x', m.x);
      holder.setAttribute('y', m.y);
      drawLeader(svg, m);
    };
    grip.onpointerup = () => { grip.onpointermove = null; };
  });
  return grip;
}

/* Thin line from a mark to its note, like a Word comment. */
function leaderEnds(note, anchor) {
  const noteMid = { x: note.x + note.w / 2, y: note.y + note.h / 2 };
  let from;
  if (anchor.type === 'line') {
    const gap = (x, y) => Math.hypot(x - noteMid.x, y - noteMid.y);
    from = gap(anchor.x1, anchor.y1) < gap(anchor.x2, anchor.y2) ? { x: anchor.x1, y: anchor.y1 } : { x: anchor.x2, y: anchor.y2 };
  } else {
    const rx = anchor.w / 2, ry = anchor.h / 2, cx = anchor.x + rx, cy = anchor.y + ry;
    if (anchor.type === 'circle') {
      const angle = Math.atan2((noteMid.y - cy) / ry, (noteMid.x - cx) / rx);
      from = { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
    } else {
      from = { x: cx, y: cy };
    }
  }
  const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
  return { x1: from.x, y1: from.y, x2: clamp(from.x, note.x, note.x + note.w), y2: clamp(from.y, note.y, note.y + note.h) };
}

function drawLeader(svg, note) {
  const anchor = markById(note.anchor);
  svg.querySelector(`[data-leader="${note.id}"]`)?.remove();
  if (!anchor) return;
  svg.prepend(el('line', { ...leaderEnds(note, anchor), 'data-leader': note.id, stroke: anchor.color,
                           'stroke-width': LEADER_WIDTH, 'pointer-events': 'none' }));
}

function drawHandles(svg, m) {
  const scale = svg.viewBox.baseVal.width / svg.getBoundingClientRect().width;
  const handle = (name, x, y) => svg.append(el('rect', {
    class: 'handle', 'data-handle': name, x: x - 4 * scale, y: y - 4 * scale, width: 8 * scale, height: 8 * scale,
    'stroke-width': 1.5 * scale, style: `cursor:${name === 'p1' || name === 'p2' ? 'move' : 'nwse-resize'}`,
  }));
  if (m.type === 'line') {
    handle('p1', m.x1, m.y1);
    handle('p2', m.x2, m.y2);
    return;
  }
  const b = bounds(m);
  svg.append(el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: 'none', stroke: '#1f5fbf',
                          'stroke-width': scale, 'stroke-dasharray': `${4 * scale}`, 'pointer-events': 'none' }));
  handle('nw', b.x, b.y);
  handle('ne', b.x + b.w, b.y);
  handle('sw', b.x, b.y + b.h);
  handle('se', b.x + b.w, b.y + b.h);
}

function redraw() {
  document.querySelectorAll('.page svg').forEach(svg => {
    svg.replaceChildren();
    svg.setAttribute('class', tool === 'select' ? '' : tool === 'text' ? 'text' : 'draw');
  });
  marks.forEach(m => { const svg = svgFor(m.page); if (svg) drawMark(svg, m); });
  marks.forEach(m => { const svg = svgFor(m.page); if (svg && m.anchor) drawLeader(svg, m); });
  const current = markById(selected);
  if (current && editing !== current.id) drawHandles(svgFor(current.page), current);
  refreshButtons();
}

/* ---------- pointer ---------- */
function pointIn(svg, event) {
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return { x: p.x, y: p.y };
}

function newMark(type, page, fields) {
  const mark = { id: crypto.randomUUID(), type, page, color: toolColor[type], ...fields };
  if (type === 'tick' || type === 'cross') mark.width = STAMP_WIDTH;
  else if (type === 'circle' || type === 'line') mark.width = LINE_WIDTH;
  return mark;
}

function openNote(page, x, y, color, anchor) {
  const before = clone(marks);
  const note = newMark('text', page, { x, y, w: NOTE_WIDTH, h: 20, size: NOTE_SIZE, text: '', color, anchor });
  marks.push(note);
  editNote(note.id, before);
}

/* Beside the mark, or on its left when the right side would run off the page. */
function noteBeside(mark) {
  const b = bounds(mark), page = pages[mark.page];
  const right = (mark.type === 'line' ? Math.max(mark.x1, mark.x2) : b.x + b.w) + NOTE_GAP;
  const x = right + NOTE_WIDTH <= page.w ? right : Math.max(0, b.x - NOTE_GAP - NOTE_WIDTH);
  openNote(mark.page, x, Math.min(b.y, page.h - 30), mark.color, mark.id);
}

function onPointerDown(event) {
  if (event.button !== 0) return;
  const handle = event.target.dataset?.handle;
  const id = event.target.closest('[data-id]')?.dataset.id;
  finishEditing();
  const svg = event.currentTarget;
  const page = Number(svg.parentElement.dataset.n);
  const start = pointIn(svg, event);
  svg.setPointerCapture(event.pointerId);

  if (tool === 'select' || markById(id)?.type === 'text') {  // notes can be dragged under any tool
    if (!handle && id !== selected) { selected = id ?? null; redraw(); }
    if (selected) gesture = { kind: handle ? 'resize' : 'move', handle, svg, start, page,
                              before: clone(marks), original: clone(markById(selected)) };
    return;
  }
  if (tool === 'tick' || tool === 'cross') {
    const half = STAMP_SIZE / 2;
    const mark = newMark(tool, page, { x: start.x - half, y: start.y - half, w: STAMP_SIZE, h: STAMP_SIZE });
    change(() => marks.push(mark));
    if (NOTE_AFTER.has(tool)) noteBeside(mark);
    return;
  }
  if (tool === 'text') {
    openNote(page, start.x, start.y, toolColor.text);
    return;
  }
  gesture = { kind: 'draw', svg, start, page, before: clone(marks), mark: null };
}

function onPointerMove(event) {
  if (!gesture) return;
  const p = pointIn(gesture.svg, event);
  const dx = p.x - gesture.start.x, dy = p.y - gesture.start.y;
  if (gesture.kind === 'draw') {
    if (!gesture.mark) {
      if (Math.hypot(dx, dy) < MIN_DRAG) return;
      gesture.mark = newMark(tool, gesture.page, {});
      marks.push(gesture.mark);
      selected = null;
    }
    const m = gesture.mark;
    if (m.type === 'line') Object.assign(m, { x1: gesture.start.x, y1: gesture.start.y, x2: p.x, y2: p.y });
    else Object.assign(m, { x: Math.min(p.x, gesture.start.x), y: Math.min(p.y, gesture.start.y),
                            w: Math.abs(dx), h: Math.abs(dy) });
  } else {
    const m = markById(selected), o = gesture.original;
    if (gesture.kind === 'move') {
      if (m.type === 'line') Object.assign(m, { x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy });
      else Object.assign(m, { x: o.x + dx, y: o.y + dy });
    } else if (m.type === 'line') {
      const end = gesture.handle === 'p1' ? { x1: p.x, y1: p.y } : { x2: p.x, y2: p.y };
      Object.assign(m, end);
    } else {
      resizeBox(m, o, gesture.handle, p);
    }
    gesture.changed = true;
  }
  redraw();
}

function resizeBox(m, o, handle, p) {
  const left = handle.includes('w') ? Math.min(p.x, o.x + o.w - MIN_DRAG) : o.x;
  const right = handle.includes('e') ? Math.max(p.x, o.x + MIN_DRAG) : o.x + o.w;
  const top = handle.includes('n') ? Math.min(p.y, o.y + o.h - MIN_DRAG) : o.y;
  const bottom = handle.includes('s') ? Math.max(p.y, o.y + MIN_DRAG) : o.y + o.h;
  Object.assign(m, { x: left, y: top, w: right - left, h: bottom - top });
}

function onPointerUp() {
  if (!gesture) return;
  const { kind, before, mark, changed } = gesture;
  gesture = null;
  if ((kind === 'draw' && mark) || changed) change(() => {}, before);
  if (mark && NOTE_AFTER.has(mark.type)) noteBeside(mark);
  if (kind === 'move' && tool !== 'select') {  // a note under a drawing tool: click edits, drag just moves
    if (changed) { selected = null; redraw(); }
    else editNote(selected, clone(marks));
  }
}

/* The pointer is captured by the svg, so the first click's selection identifies the note. */
function onDoubleClick() {
  if (tool === 'select' && markById(selected)?.type === 'text') editNote(selected, clone(marks));
}

/* ---------- comment text ---------- */
let noteBefore = null;

function editNote(id, before) {
  editing = id;
  selected = id;
  noteBefore = before;
  redraw();
}

function finishEditing() {
  if (!editing) return;
  const id = editing;
  const box = document.querySelector('textarea.note');
  const text = box ? box.value : markById(id).text;
  const before = noteBefore;
  editing = null;
  noteBefore = null;
  if (tool !== 'select') selected = null;  // keep marking: no handles on the finished note
  const previous = before.find(m => m.id === id), note = markById(id);
  const unchanged = previous && text.trim() === previous.text.trim() && note.x === previous.x && note.y === previous.y;
  if (unchanged || (!previous && !text.trim())) {
    marks = before;
    if (!markById(id)) selected = null;
    redraw();
    return;
  }
  change(() => {
    if (text.trim()) markById(id).text = text.trimEnd();
    else { marks = marks.filter(m => m.id !== id); selected = null; }
  }, before);
}

/* ---------- commands ---------- */
function setTool(name) {
  finishEditing();
  tool = name;
  if (name !== 'select') selected = null;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === name));
  redraw();
}

function setColor(color) {
  const current = markById(selected);
  if (current) {
    change(() => { current.color = color; });
    toolColor[current.type] = color;
  } else if (toolColor[tool]) {
    toolColor[tool] = color;
    refreshButtons();
  }
}

function deleteSelected() {
  if (!selected) return;
  change(() => {
    marks = marks.filter(m => m.id !== selected && m.anchor !== selected);  // a mark takes its note with it
    selected = null;
  });
}

async function save() {
  finishEditing();
  if (!file || !dirty) return true;
  status('保存中…');
  const payload = marks.map(({ leader, ...m }) => {
    const anchor = markById(m.anchor);
    return anchor ? { ...m, leader: { ...leaderEnds(m, anchor), color: anchor.color, width: LEADER_WIDTH } } : m;
  });
  const response = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify({ file, marks: payload }) });
  const result = await response.json();
  if (!response.ok) { status('保存失败：' + result.error, true); return false; }
  dirty = false;
  status(`已保存 ${result.saved} 处批注`);
  refreshButtons();
  await loadFiles();
  return true;
}

function applyZoom() {
  document.querySelectorAll('.page').forEach(node => {
    const page = pages[node.dataset.n];
    node.style.width = page.w * zoom + 'px';
    node.style.height = page.h * zoom + 'px';
  });
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  redraw();
}

function stepZoom(factor) {
  zoom = Math.min(4, Math.max(.3, zoom * factor));
  applyZoom();
}

/* ---------- files ---------- */
async function api(url) {
  const response = await fetch(url);
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  return result;
}

function fileButton(row) {
  const button = document.createElement('button');
  button.className = 'file' + (row.file === file ? ' on' : '');
  button.textContent = row.name;
  if (row.marks) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = row.marks;
    button.append(badge);
  }
  button.onclick = () => openFile(row.file).catch(error => status(error.message, true));
  return button;
}

const closedFolders = new Set();

async function loadFiles() {
  const { root, groups } = await api('/api/tree');
  $('root').textContent = root ?? '还没有选择工作区';
  $('files').replaceChildren(...groups.map(group => {
    const folder = document.createElement('details');
    folder.open = !closedFolders.has(group.dir);
    folder.ontoggle = () => folder.open ? closedFolders.delete(group.dir) : closedFolders.add(group.dir);
    const title = document.createElement('summary');
    title.textContent = `${group.dir === '.' ? '（根目录）' : group.dir}  ${group.files.length}`;
    folder.append(title, ...group.files.map(fileButton));
    return folder;
  }));
  if (root && !groups.length) $('files').textContent = '这个文件夹下没有 PDF';
}

async function pickWorkspace() {
  if (!(await save())) return;
  status('请在弹出的窗口里选择文件夹');
  const response = await fetch('/api/workspace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const result = await response.json();
  if (!response.ok) { status('选择失败：' + result.error, true); return; }
  status('');
  if (!result.changed) return;
  file = null;
  pages = [];
  marks = [];
  selected = null;
  undoStack = [];
  redoStack = [];
  closedFolders.clear();
  const empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = '在左侧打开一份 PDF';
  $('main').replaceChildren(empty);
  refreshButtons();
  await loadFiles();
}

async function openFile(next) {
  if (next === file || !(await save())) return;
  const doc = await api('/api/doc?file=' + encodeURIComponent(next));
  file = next;
  pages = doc.pages;
  marks = doc.marks;
  selected = null;
  undoStack = [];
  redoStack = [];
  dirty = false;
  const main = $('main');
  main.replaceChildren(...pages.map((page, n) => {
    const node = document.createElement('div');
    node.className = 'page';
    node.dataset.n = n;
    const image = new Image();
    image.loading = 'lazy';
    image.src = `/api/page?file=${encodeURIComponent(file)}&n=${n}&w=1800`;
    const svg = el('svg', { viewBox: `0 0 ${page.w} ${page.h}` });
    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('dblclick', onDoubleClick);
    node.append(image, svg);
    return node;
  }));
  zoom = Math.min(1.6, (main.clientWidth - 60) / Math.max(...pages.map(p => p.w)));  // padding + scrollbar
  applyZoom();
  main.scrollTop = 0;
  status(marks.length ? `已载入 ${marks.length} 处批注，可继续修改` : '');
  await loadFiles();
}

/* ---------- setup ---------- */
$('tools').append(...TOOLS.map(([name, label, key]) => {
  const button = document.createElement('button');
  button.dataset.tool = name;
  button.title = `${label}（快捷键 ${key}）`;
  button.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>${label}<kbd>${key}</kbd>`;
  button.onclick = () => setTool(name);
  return button;
}));
$('colors').append(...COLORS.map(color => {
  const button = document.createElement('button');
  button.className = 'swatch';
  button.dataset.color = color;
  button.style.background = color;
  button.title = '颜色';
  button.onclick = () => setColor(color);
  return button;
}));
$('undo').onclick = () => restore(undoStack, redoStack);
$('redo').onclick = () => restore(redoStack, undoStack);
$('delete').onclick = deleteSelected;
$('zoomIn').onclick = () => stepZoom(1.2);
$('zoomOut').onclick = () => stepZoom(1 / 1.2);
$('save').onclick = save;
$('openPdf').onclick = () => window.open('/pdf?file=' + encodeURIComponent(file));
$('pick').onclick = () => pickWorkspace().catch(error => status(error.message, true));

addEventListener('keydown', event => {
  if (event.target.matches('textarea, select, input')) return;
  const command = event.ctrlKey || event.metaKey;
  const key = event.key.toLowerCase();
  if (command && key === 's') { event.preventDefault(); save(); }
  else if (command && key === 'z') { event.preventDefault(); event.shiftKey ? restore(redoStack, undoStack) : restore(undoStack, redoStack); }
  else if (command && key === 'y') { event.preventDefault(); restore(redoStack, undoStack); }
  else if (command) return;
  else if (key === 'delete' || key === 'backspace') deleteSelected();
  else if (key === 'escape') setTool('select');
  else { const match = TOOLS.find(t => t[2].toLowerCase() === key); if (match) setTool(match[0]); }
});
addEventListener('beforeunload', event => { if (dirty) event.preventDefault(); });

setTool('select');
loadFiles().catch(error => status(error.message, true));
</script>
</body>
</html>
